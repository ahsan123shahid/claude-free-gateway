      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # Catch-all: koi bhi aur Claude model name -> free gpt-6-luna
  - model_name: "*"
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # --- OpenRouter FREE fallback (jab Experiential Labs quota khatam ho) ---
  # Proxy-internal group; app ke picker mein nahi dikhta (inferenceModels explicit hai).
  # Saare image-capable hain (text + image dono fallback ke liye safe).
  # OPENROUTER_API_KEY na ho to ye entries error log dengi, proxy phir bhi chalega.
  - model_name: or-free
    litellm_params:
      model: "openrouter/qwen/qwen3.8-27b:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: or-free
    litellm_params:
      model: "openrouter/google/gemma-4-31b-it:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: or-free
    litellm_params:
      model: "openrouter/google/gemma-4-26b-a4b-it:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: or-free
    litellm_params:
      model: "openrouter/dots-studio/dots-3-note-preview:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: or-free
    litellm_params:
      model: "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

litellm_settings:
  drop_params: true
  callbacks: custom_hooks.proxy_handler_instance

# Jab primary (Experiential Labs) 429/quota/error de -> OpenRouter free par switch
router_settings:
  num_retries: 2
  fallbacks:
    - claude-sonnet-4-5-20250929: ["or-free"]
    - claude-sonnet-4-5: ["or-free"]
    - claude-sonnet-5: ["or-free"]
    - claude-haiku-4-5-20251001: ["or-free"]
    - claude-haiku-4-5: ["or-free"]
    - claude-opus-5-5: ["or-free"]
    - claude-opus-5: ["or-free"]
    - claude-luna-5-6: ["or-free"]
    - claude-flash-free: ["or-free"]
    - claude-pro-2-6: ["or-free"]
