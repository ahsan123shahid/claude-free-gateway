# LiteLLM proxy config — Claude Desktop/CLI -> free model gateway
# Proxy: http://127.0.0.1:4000
#
# Keys yahan direct nahi hain — sab .env file se aati hain (gitignored).
# .env mein sirf yeh 2 zaroori hain:
#   EXPERIENTIAL_API_KEY=xpl_...
#   OPENROUTER_API_KEY=sk-or-v1-...     (optional fallback ke liye)
#
# App SIRF Anthropic-format namon ko accept karta hai (gpt/deepseek/mimo names
# reject ho jate hain). Isliye free models Claude-style route namon se expose
# kiye gaye hain; asli model yahan map hota hai:
#
#   claude-sonnet-4-5-20250929 -> GPT-6 Luna       (FREE)  [Sonnet slot, images OK]
#   claude-haiku-4-5-20251001  -> GPT-6 Luna       (FREE)  [Haiku slot, images OK]
#   claude-luna-5-6            -> GPT-5.6 Luna     (cheap, images OK)
#   claude-flash-free          -> DeepSeek V4 Flash (FREE, text only)
#   claude-pro-2-6             -> MiMo v2.6 Pro    (FREE, text only)
#   claude-opus-5-5            -> Claude Opus 5.5  (paid, strong, images OK)
#   claude-sonnet-5            -> GPT-6 Luna       (FREE)
#
# Image blocks (pics/screenshots): custom_hooks.py text-only routes ko
# gpt-6-luna par auto-shift kar deta hai (Jugaad #3).

model_list:
  # --- Sonnet slot: free flagship ---
  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-sonnet-5
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # --- Haiku slot: free fast ---
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-haiku-4-5
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # --- Opus slot: paid, strong ---
  - model_name: claude-opus-5-5
    litellm_params:
      model: "anthropic/claude-opus-5.5"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-opus-5
    litellm_params:
      model: "anthropic/claude-opus-5.5"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # --- Free model aliases (Claude-style names -> free models) ---
  - model_name: claude-luna-5-6
    litellm_params:
      model: "anthropic/gpt-5.6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-flash-free
    litellm_params:
      model: "anthropic/deepseek-v4-flash"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: claude-pro-2-6
    litellm_params:
      model: "anthropic/mimo-v2.6-pro"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  # --- Direct free-model names (API tests ke liye; app picker inhein reject karta hai) ---
  - model_name: gpt-6-luna
    litellm_params:
      model: "anthropic/gpt-6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: gpt-5.6-luna
    litellm_params:
      model: "anthropic/gpt-5.6-luna"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
      drop_params: true
      additional_drop_params: ["thinking"]

  - model_name: deepseek-v4-flash
    litellm_params:
      model: "anthropic/deepseek-v4-flash"
      api_base: "https://api.experientiallabs.ai"
      api_key: "os.environ/EXPERIENTIAL_API_KEY"
